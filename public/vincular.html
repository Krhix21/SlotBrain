<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Configuración del bot</title>
</head>
<body style="margin:0;font-family:sans-serif;background:#0c0a09;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;">
  <div style="text-align:center;padding:40px;max-width:520px;">

    <h1 style="color:#f59e0b;font-size:26px;margin-bottom:8px;">Bot de WhatsApp 💈</h1>

    <!--
      Antes esta página escaneaba un QR de whatsapp-web.js.
      Con la Meta Cloud API no hay QR: el número ya está registrado en
      Meta y es el mismo para siempre. Lo que queda por configurar se
      hace desde el panel de administración.
    -->

    <div style="text-align:left;background:#1c1917;border:1px solid #292524;border-radius:10px;padding:20px;margin-top:24px;">
      <h2 style="color:#f59e0b;font-size:17px;margin:0 0 12px;">¿Qué falta configurar?</h2>

      <ol style="color:#d6d3d1;font-size:14px;line-height:1.9;padding-left:20px;margin:0;">
        <li>Registrar tu número de WhatsApp en el panel → <strong>Números</strong>.</li>
        <li>Crear al menos un profesional y enlazarle su Google Calendar.</li>
        <li>Definir los servicios que ofrece.</li>
      </ol>

      <a href="/admin.html"
         style="display:inline-block;margin-top:18px;padding:12px 24px;background:#f59e0b;color:#0c0a09;
                text-decoration:none;border-radius:8px;font-weight:bold;">
        Ir al panel de administración
      </a>
    </div>

    <div id="estadoGeneral" style="margin-top:20px;font-size:13px;color:#78716c;">
      <span id="estadoTexto">Consultando estado del servidor...</span>
    </div>

  </div>

  <script>
    // Esta página ya no gestiona la conexión: solo informa si el
    // servidor responde y si hay algún profesional con calendario listo.
    const estadoTexto = document.getElementById('estadoTexto');

    async function consultarEstado() {
      try {
        const res = await fetch('/api/estado');
        const estado = await res.json();

        if (estado.calendarConectado) {
          const n = estado.calendariosEnlazados;
          estadoTexto.textContent = `Hay ${n} calendario${n === 1 ? '' : 's'} enlazado${n === 1 ? '' : 's'} en esta sesión.`;
          estadoTexto.style.color = '#22c55e';
        } else {
          estadoTexto.textContent = 'El servidor está arriba. Enlaza los calendarios desde el panel.';
          estadoTexto.style.color = '#a8a29e';
        }
      } catch (err) {
        estadoTexto.textContent = 'El servidor no responde.';
        estadoTexto.style.color = '#ef4444';
      }
    }

    consultarEstado();
  </script>
</body>
</html>
